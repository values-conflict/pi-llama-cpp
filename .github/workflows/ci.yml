name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: '0 9 * * 1'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: tianon/actions/checkout/composite@f7414637108a155a422f9894dc1e0a9990892dfc # HEAD

      - run: npm install

      - run: npm run typecheck

      - run: npm run 'biome:ci'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: tianon/actions/checkout/composite@f7414637108a155a422f9894dc1e0a9990892dfc # HEAD

      - run: npm install

      - run: npm run test
